# This host is retired. Publish only the static redirect site in netlify-public.
# Do not build or serve the Next.js app: crawlers hitting server-rendered
# pages are what drive the unwanted Netlify function usage.
[build]
  command = "echo 'Redirect-only deploy. Next.js build is intentionally skipped.'"
  publish = "netlify-public"

[build.environment]
  # Netlify auto-installs the Next.js runtime when it sees this repo.
  # Skip it so the deploy does not publish serverless or edge functions.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[dev]
  framework = "#static"
  publish = "netlify-public"
  port = 8888

# Crawlers must be able to fetch robots.txt. A 301 here can make them apply
# the destination site's robots.txt to this host, or stop crawling before
# they observe the page redirects. This file allows crawling and has no sitemap.
[[redirects]]
  from = "/robots.txt"
  to = "/robots-allow.txt"
  status = 200
  force = true

# Every other path moves permanently, including /, /sitemap.xml, and assets.
# force makes the redirect win over any file that a future build might publish.
[[redirects]]
  from = "/*"
  to = "https://docs.novu.co/:splat"
  status = 301
  force = true

# These headers apply to files this host actually serves, such as robots.txt.
# Netlify does not attach them to the 301 responses; those URLs are retired
# by the redirect itself.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
